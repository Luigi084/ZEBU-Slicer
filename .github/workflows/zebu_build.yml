# ZEBU Slicer - builds the Windows installer and the Linux AppImage.
#  - manual run (Actions > ZEBU build > Run workflow): artifacts only
#  - tag "vX.Y.Z[-beta...]" pushed: artifacts + a GitHub release (pre-release when the tag has a "-")
#    that the built-in updater reads.
name: ZEBU build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write   # lets the jobs drop their older compiler-cache entries

env:
  # Compiler cache (ccache). Restored before the build and saved after it, even when the build
  # fails, so the next run only recompiles what changed. One entry per run; older ones are dropped.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  # Freshly checked-out headers, __DATE__/__TIME__ users and the precompiled header (Linux).
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_DEPEND: '1'

concurrency:
  group: zebu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Windows builds with Visual Studio's clang-cl + Ninja (-l -x), like OrcaSlicer's own releases:
      # the MSBuild generator cannot use a compiler cache. clang-cl dependencies live in deps/build-clang.
      # Dependencies are cached right after they are built, so a later failure (ZEBU itself) keeps them.
      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/build-clang
          key: zebu-deps-win-clang-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt', 'deps/**/*.patch') }}

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: build_win.bat -d -l -x

      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build-clang
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: zebu-win
          max-size: 2G
          restore: false
          save: false
          job-summary: ''

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: zebu-ccache-win-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zebu-ccache-win-

      - name: Build ZEBU Slicer
        shell: cmd
        run: |
          ccache -z
          build_win.bat -s -l -x --cache ccache --build-dir build

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: ccache -s || true

      # A tag run only reads the branch cache: what it would save is visible to that tag alone.
      - name: Save compiler cache
        id: ccache-save
        if: always() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: zebu-ccache-win-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Drop older compiler cache entries
        if: always() && steps.ccache-save.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: zebu-ccache-win-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key zebu-ccache-win- --limit 100 --json key -q '.[].key' > "$RUNNER_TEMP/keys.txt"
          grep -qx "$KEEP" "$RUNNER_TEMP/keys.txt" || { echo "new entry not listed, keeping the old ones"; exit 0; }
          grep -vx "$KEEP" "$RUNNER_TEMP/keys.txt" | while read -r k; do gh cache delete "$k" --repo "$GITHUB_REPOSITORY" || true; done

      - name: Build installer
        shell: pwsh
        run: |
          $env:Path = "${env:ProgramFiles(x86)}\NSIS;$env:Path"
          .\packaging\windows\build_installer.ps1 -BuildDir build -Config Release

      - uses: actions/upload-artifact@v4
        with:
          name: ZEBU_Slicer_Windows
          path: |
            build/ZEBU_Slicer_Windows_Installer_*.exe
            build/ZEBU_Slicer_Windows_Installer_*.exe.sha256

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Dependencies are cached right after they are built, so a later failure (ZEBU itself) keeps them.
      - name: Restore dependencies
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: deps/build
          key: zebu-deps-linux-${{ hashFiles('deps/**/*.cmake', 'deps/CMakeLists.txt', 'deps/**/*.patch') }}

      - name: System packages
        run: ./build_linux.sh -u

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./build_linux.sh -dr

      - name: Save dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps/build
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      # build_linux.sh uses ccache by itself once it is installed.
      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: zebu-ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zebu-ccache-linux-

      - name: Build ZEBU Slicer and the AppImage
        run: |
          ccache -z
          ./build_linux.sh -sir

      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      # A tag run only reads the branch cache: what it would save is visible to that tag alone.
      - name: Save compiler cache
        id: ccache-save
        if: always() && !startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: zebu-ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Drop older compiler cache entries
        if: always() && steps.ccache-save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: zebu-ccache-linux-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key zebu-ccache-linux- --limit 100 --json key -q '.[].key' > "$RUNNER_TEMP/keys.txt"
          grep -qx "$KEEP" "$RUNNER_TEMP/keys.txt" || { echo "new entry not listed, keeping the old ones"; exit 0; }
          grep -vx "$KEEP" "$RUNNER_TEMP/keys.txt" | while read -r k; do gh cache delete "$k" --repo "$GITHUB_REPOSITORY" || true; done

      - name: Checksum
        run: |
          cd build
          for f in ZEBU_Slicer_Linux_V*.AppImage; do sha256sum "$f" > "$f.sha256"; done
          ls -la ZEBU_Slicer_Linux_V*

      - uses: actions/upload-artifact@v4
        with:
          name: ZEBU_Slicer_Linux
          path: |
            build/ZEBU_Slicer_Linux_V*.AppImage
            build/ZEBU_Slicer_Linux_V*.AppImage.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "ZEBU Slicer ${TAG#v}" \
            --notes "ZEBU Slicer ${TAG#v}" $prerelease
